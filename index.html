<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Kerst Markt Motivatie</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden}
body{
  background:#07162b;
  font-family:Arial,sans-serif;
}
.scene{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 78%,rgba(255,244,197,.16),transparent 18%),
    linear-gradient(180deg,#030b18 0%,#081b34 43%,#123552 72%,#dbeaf0 100%);
}
.sky-glow{
  position:absolute;left:50%;top:42%;width:min(75vw,1000px);height:min(75vw,1000px);
  transform:translate(-50%,-50%);
  background:radial-gradient(circle,rgba(112,168,205,.18),rgba(112,168,205,0) 66%);
  filter:blur(8px);
}
.stars{
  position:absolute;inset:0;opacity:.65;
  background-image:
    radial-gradient(circle,rgba(255,255,255,.95) 0 1px,transparent 1.6px),
    radial-gradient(circle,rgba(255,255,255,.6) 0 .8px,transparent 1.4px);
  background-size:125px 125px,73px 73px;
  background-position:12px 7px,35px 40px;
}
.stars:after{
  content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 18% 26%,rgba(255,255,255,.9) 0 1px,transparent 2px),
             radial-gradient(circle at 74% 18%,rgba(255,255,255,.9) 0 1px,transparent 2px),
             radial-gradient(circle at 86% 34%,rgba(255,255,255,.8) 0 1px,transparent 2px);
}
.moon{
  position:absolute;right:9vw;top:8vh;width:clamp(70px,9vw,125px);aspect-ratio:1;
  border-radius:50%;
  background:
    radial-gradient(circle at 22% 26%,rgba(181,169,135,.40) 0 7%,transparent 7.8%),
    radial-gradient(circle at 68% 19%,rgba(181,169,135,.30) 0 9%,transparent 9.8%),
    radial-gradient(circle at 56% 46%,rgba(171,159,127,.35) 0 12%,transparent 12.8%),
    radial-gradient(circle at 25% 61%,rgba(181,169,135,.29) 0 10%,transparent 10.8%),
    radial-gradient(circle at 77% 70%,rgba(171,159,127,.31) 0 7%,transparent 7.8%),
    radial-gradient(circle at 43% 82%,rgba(181,169,135,.25) 0 8%,transparent 8.8%),
    radial-gradient(circle at 82% 39%,rgba(161,149,119,.24) 0 5%,transparent 5.8%),
    linear-gradient(180deg,#fffef3 0%,#fff8d5 60%,#e7dbad 100%);
  box-shadow:0 0 25px rgba(255,249,220,.35),0 0 90px rgba(255,240,170,.16);
}
.moon:before{
  content:"";position:absolute;inset:0;border-radius:50%;
  background:
    radial-gradient(circle at 31% 34%,rgba(255,255,255,.30) 0 5%,transparent 5.8%),
    radial-gradient(circle at 63% 58%,rgba(255,255,255,.20) 0 6%,transparent 6.8%),
    radial-gradient(circle at 45% 70%,rgba(255,255,255,.16) 0 4%,transparent 4.8%);
  mix-blend-mode:screen;
}
.moon:after{
  content:"";position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 64% 26%,rgba(161,149,119,.20) 0 4%,transparent 4.8%),
             radial-gradient(circle at 34% 48%,rgba(161,149,119,.17) 0 4%,transparent 4.8%);
}
.haze{
  position:absolute;left:-10%;right:-10%;bottom:17%;height:25%;
  background:radial-gradient(ellipse at center,rgba(215,239,246,.18),transparent 65%);
  filter:blur(22px);
}
.mountain{
  position:absolute;left:-10%;right:-10%;bottom:15%;height:35%;
  background:
    linear-gradient(135deg,transparent 0 24%,#173653 24.2% 25%,transparent 25.2%),
    linear-gradient(45deg,transparent 0 44%,#102b47 44.2% 45%,transparent 45.2%);
  clip-path:polygon(0 100%,0 68%,14% 50%,25% 67%,38% 34%,52% 70%,65% 43%,79% 65%,91% 31%,100% 62%,100% 100%);
  opacity:.9;
}
.forest{
  position:absolute;left:-5%;right:-5%;bottom:11%;height:30%;
  background:#081d30;
  clip-path:polygon(
    0 100%,0 68%,3% 68%,5% 49%,7% 68%,10% 35%,12% 68%,15% 54%,17% 68%,19% 29%,21% 68%,
    24% 43%,26% 68%,29% 51%,31% 68%,34% 33%,36% 68%,39% 45%,41% 68%,44% 28%,46% 68%,
    49% 48%,51% 68%,54% 36%,56% 68%,59% 52%,61% 68%,64% 31%,66% 68%,69% 46%,71% 68%,
    74% 27%,76% 68%,79% 43%,81% 68%,84% 33%,86% 68%,89% 49%,91% 68%,94% 37%,96% 68%,100% 54%,100% 100%);
}
.village{
  position:absolute;left:50%;bottom:13.5%;width:min(800px,80vw);height:24%;
  transform:translateX(-50%);
}
.house{
  position:absolute;bottom:0;width:15%;min-width:85px;height:48%;
  background:linear-gradient(90deg,#243747 0%,#344b5a 58%,#1a2b3a 100%);
  border-radius:4px 4px 1px 1px;
  box-shadow:0 10px 30px rgba(0,0,0,.28);
}
.house:before{
  content:"";position:absolute;left:-12%;top:-34%;width:124%;height:48%;
  background:linear-gradient(180deg,#314a5d 0%,#1b2e42 100%);
  clip-path:polygon(50% 0,100% 100%,0 100%);
  filter:drop-shadow(0 3px 2px rgba(0,0,0,.2));
}
.house:after{
  content:"";position:absolute;left:18%;top:42%;width:18%;height:23%;
  background:#ffd980;
  box-shadow:46px 0 0 #ffd980,92px 0 0 #ffd980;
  border:2px solid rgba(31,48,60,.65);
  filter:drop-shadow(0 0 7px rgba(255,217,128,.45));
}
.house:nth-child(1){left:3%;transform:scale(.72);transform-origin:bottom}
.house:nth-child(2){left:23%;transform:scale(.95);transform-origin:bottom}
.house:nth-child(3){left:45%;transform:scale(1.18);transform-origin:bottom}
.house:nth-child(4){left:69%;transform:scale(.88);transform-origin:bottom}
.house:nth-child(5){left:88%;transform:scale(.65);transform-origin:bottom}

.lamp{
  position:absolute;bottom:21%;width:4px;height:115px;background:#182935;
  border-radius:3px;
  box-shadow:0 0 0 1px rgba(0,0,0,.15),0 0 10px rgba(0,0,0,.12);
}
.lamp:before{
  content:"";position:absolute;left:50%;top:-3px;width:32px;height:4px;
  transform:translateX(-50%);
  border-radius:3px;background:#182935;
}
.lamp:after{
  content:"";position:absolute;left:50%;top:-22px;transform:translateX(-50%);
  width:18px;height:18px;border-radius:50%;
  background:#ffe29a;
  box-shadow:0 0 22px 8px rgba(255,221,135,.35);
}
.l1{left:14%}.l2{left:32%}.l3{left:63%}.l4{left:83%}

.ground{
  position:absolute;inset:auto 0 0;height:22%;
  background:
    radial-gradient(ellipse at 50% -12%,rgba(255,255,255,.98),rgba(235,246,249,.98) 47%,#d6e8ed 100%);
  clip-path:polygon(0 18%,7% 14%,15% 19%,24% 11%,34% 18%,44% 10%,55% 17%,67% 8%,77% 16%,88% 10%,100% 17%,100% 100%,0 100%);
}
.tree{
  position:absolute;bottom:12%;width:0;height:0;
  border-left:clamp(42px,5vw,75px) solid transparent;
  border-right:clamp(42px,5vw,75px) solid transparent;
  border-bottom:clamp(145px,17vw,245px) solid #0b2b27;
  filter:drop-shadow(0 14px 22px rgba(0,0,0,.25));
}
.tree:before{
  content:"";position:absolute;left:calc(clamp(42px,5vw,75px)*-0.82);top:34%;
  border-left:calc(clamp(42px,5vw,75px)*.82) solid transparent;
  border-right:calc(clamp(42px,5vw,75px)*.82) solid transparent;
  border-bottom:calc(clamp(145px,17vw,245px)*.62) solid #10453b;
}
.tree:after{
  content:"";position:absolute;left:calc(clamp(42px,5vw,75px)*-0.60);top:63%;
  border-left:calc(clamp(42px,5vw,75px)*.60) solid transparent;
  border-right:calc(clamp(42px,5vw,75px)*.60) solid transparent;
  border-bottom:calc(clamp(145px,17vw,245px)*.45) solid #155944;
}
.tree .trunk{position:absolute;left:-11px;top:100%;width:22px;height:70px;background:#4f3527}
.tree .snow{position:absolute;left:-68px;top:-5px;width:136px;height:20px;background:linear-gradient(180deg,#fff,#d8e9ee);clip-path:polygon(0 90%,8% 38%,18% 72%,31% 15%,44% 64%,58% 24%,70% 67%,83% 20%,100% 75%,100% 100%,0 100%)}
.t1{left:6%;transform:scale(.7);transform-origin:bottom}
.t2{left:19%;transform:scale(.95);transform-origin:bottom}
.t3{right:17%;transform:scale(.92);transform-origin:bottom}
.t4{right:3%;transform:scale(.64);transform-origin:bottom}
.snowflake{
  position:absolute;top:-40px;color:rgba(255,255,255,.88);
  animation:fall linear infinite;pointer-events:none;text-shadow:0 0 7px rgba(255,255,255,.35);
}
@keyframes fall{to{transform:translate3d(20px,115vh,0) rotate(260deg)}}
.title{
  position:absolute;top:7%;left:50%;transform:translateX(-50%);
  text-align:center;color:rgba(255,255,255,.9);letter-spacing:7px;text-transform:uppercase;
  font-size:clamp(11px,1.3vw,17px);font-weight:700;text-shadow:0 2px 15px rgba(0,0,0,.45);
}
@media(max-width:700px){
  .title{letter-spacing:4px}
  .village{width:110vw}
  .ground{height:25%}
  .tree{bottom:14%}
}
</style>
</head>
<body>
<div class="scene">
  <div class="sky-glow"></div>
  <div class="stars"></div>
  <div class="moon"></div>
  <div class="haze"></div>
  <div class="mountain"></div>
  <div class="forest"></div>

  <div class="village">
    <div class="house"></div><div class="house"></div><div class="house"></div><div class="house"></div><div class="house"></div>
    <div class="lamp l1"></div><div class="lamp l2"></div><div class="lamp l3"></div><div class="lamp l4"></div>
  </div>

  <div class="tree t1"><div class="trunk"></div><div class="snow"></div></div>
  <div class="tree t2"><div class="trunk"></div><div class="snow"></div></div>
  <div class="tree t3"><div class="trunk"></div><div class="snow"></div></div>
  <div class="tree t4"><div class="trunk"></div><div class="snow"></div></div>

  <div class="ground"></div>
  <div class="title">Kerst Markt Motivatie</div>
</div>

<script>
const scene=document.querySelector(".scene");
const symbols=["❄","•","✦"];
for(let i=0;i<100;i++){
  const s=document.createElement("div");
  s.className="snowflake";
  s.textContent=symbols[Math.floor(Math.random()*symbols.length)];
  s.style.left=Math.random()*100+"vw";
  s.style.fontSize=(7+Math.random()*15)+"px";
  s.style.opacity=(.25+Math.random()*.7).toFixed(2);
  s.style.animationDuration=(6+Math.random()*10)+"s";
  s.style.animationDelay=(-Math.random()*14)+"s";
  scene.appendChild(s);
}
</script>
</body>
</html>
